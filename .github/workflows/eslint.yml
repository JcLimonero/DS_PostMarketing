---
name: ESLint

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - eslint.config.mjs
      - apps/**
      - '!apps/docs/**'
      - libraries/**

  pull_request:
    paths:
      - package.json
      - eslint.config.mjs
      - apps/**
      - '!apps/docs/**'
      - libraries/**

concurrency:
  group: eslint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Run eslint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Lint runs from the repo root against the flat config in
      # eslint.config.mjs. There are no per-app eslint configs.
      #
      # Non-blocking for now: the repo pins eslint 8.57.0 while
      # eslint-config-next 16.2.6 requires eslint >= 9, so a root lint exits 2
      # on a config error before reporting a single rule violation. Drop the
      # continue-on-error below once those versions are reconciled.
      - name: Run ESLint
        run: pnpm exec eslint .
        continue-on-error: true
